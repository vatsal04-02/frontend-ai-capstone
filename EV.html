<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
          background-color: rgb(47, 43, 43);
          height: fit-content;
          border-color: rgb(255, 255, 255);
          border-width: 30px;
          width: 300px;
          text-align: center;
          position: absolute;
          top: 50%;
          left: 50%;
          margin-top: -50px;
          margin-left: -50px;
          border-radius: 15px;
        }

        input{
            width: 200px;
            height: fit-content;
            text-align: center;
            
        }

        body{
            display: flex;
            justify-content: center;
            align-items: middle;
            background-color: rgb(63, 65, 68);
            

        }

        #abcd{
            color: rgb(255, 255, 255);
            background-color: rgb(21, 169, 255);
        } 

        h3{
            color: antiquewhite;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            align-items: center;
            
        }



    </style>
</head>
<body>
    <div class ="card">
        <h3>Email & Password Validator</h3>
        <form>
            <input id="email" type="email" placeholder="email">
            <br><br>
            <input id="password" type ="password" placeholder="password">
            <br><br>
            <input id ="abcd"  type="submit">

        </form>
    </div>
    <script src="EV.js"></script>
</body>
</html>
